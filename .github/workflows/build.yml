name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U platformio "esptool<5"
      - run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e s3
      - name: Merge into one bin
        run: |
          B=.pio/build/s3
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32s3 merge_bin -o s3-merged.bin \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $BOOT_APP0 \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: s3-firmware
          path: |
            s3-merged.bin
            .pio/build/s3/firmware.bin
